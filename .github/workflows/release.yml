name: Update Extension Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New release version"
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update version and changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0)"
          node scripts/update-changelog.mjs "$VERSION" "$PREVIOUS_TAG" HEAD "$(date -u +%F)"

          node -e '
            const fs = require("fs");

            const path = "manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));

            manifest.version = process.env.VERSION;

            fs.writeFileSync(
              path,
              JSON.stringify(manifest, null, 2) + "\n"
            );
          '

      - name: Commit changes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifest.json CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update extension version to $VERSION"
          git push

      - name: Create source ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          zip -r "psa-speedrun-v${VERSION}.zip" . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: "Release ${{ inputs.version }}"
          generate_release_notes: true
          files: psa-speedrun-v${{ inputs.version }}.zip
